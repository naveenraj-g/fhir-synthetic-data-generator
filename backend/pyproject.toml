[project]
name = "fhir-synthetic-data-generator"
version = "0.1.0"
description = "Configurable synthetic FHIR data generator (Synthea first), built on a FastAPI layered starter."
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.14.0",
    "asyncpg>=0.31.0",
    "dependency-injector>=4.48.3",
    "fastapi[standard]>=0.129.0",
    "pydantic-settings>=2.13.0",
    "pyjwt>=2.11.0",
    "pyyaml>=6.0.3",
    "redis>=7.2.0",
    "scalar-fastapi>=1.9.1",
    "sqlalchemy[asyncio]>=2.0.46",
    "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = ["slow: needs Docker and the Synthea image (run with `just test-e2e`)"]
